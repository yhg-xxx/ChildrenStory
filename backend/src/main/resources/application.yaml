server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_story_generator?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  ai:
    openai:
      api-key: sk-d1b70d8a21fc4337ae08674ee7608184
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat

  servlet:
    multipart:
      max-file-size: 20MB     # 单个文件最大20MB
      max-request-size: 30MB  # 总请求最大30MB（需大于等于max-file-size）
      enabled: true
      file-size-threshold: 2MB


mybatis-plus:
  type-aliases-package: com.example.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true

logging:
  level:
    com.example: debug
  charset:
    console: UTF-8
